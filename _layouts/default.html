<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} :: {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta name="theme-color" content="#1a170f">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/assets/img/favicon.ico" type="image/x-icon">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
<link rel="me" href="https://digitalcourage.social/@TuringOracle">
</head>
<body>
<div class="container">
<header class="header">
  <a class="logo" href="/">ckoys</a>
  <nav class="menu"><a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Blog</a><a href="/me/"{% if page.url == "/me/" %} aria-current="page"{% endif %}>Über</a><a href="https://digitalcourage.social/@TuringOracle" rel="me noopener">Mastodon</a><a href="https://github.com/ckoys" rel="noopener">GitHub</a><a href="/feed.xml">RSS</a></nav>
</header>

<main class="content">
{{ content }}
</main>

<footer class="footer"><span>© {{ site.time | date: "%Y" }} ckoys</span> :: <a href="https://chromosphere-it.github.io/">Chromosphere IT</a> :: <a href="https://chromosphere-it.github.io/impressum.html">Impressum</a></footer>
</div>
</body>
</html>
