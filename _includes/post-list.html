{% for post in include.posts %}
<article class="post">
  <h2 class="post-title"><a href="{{ post.url }}">{{ post.title }}</a></h2>
  <p class="post-meta">{{ post.date | date: "%d.%m.%Y" }}{% if post.tags.size > 0 %} :: <span class="tags">{% for tag in post.tags %}<a href="/tag/{{ tag | slugify }}/">{{ tag }}</a>{% endfor %}</span>{% endif %}</p>
  <p>{{ post.excerpt | strip_html | strip_newlines | truncate: 220 }}</p>
  <p class="links"><a href="{{ post.url }}">[Weiterlesen]</a></p>
</article>
{% endfor %}
