title: ckoys
email: ckdevel@me.com
description: Notizen zu Security, Tools und dem, was beim Bauen schiefgeht.
permalink: /:year:month:day/:title
url: https://ckoys.github.io
baseurl: ""
lang: de
github_username: ckoys

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE
  - .DS_Store
