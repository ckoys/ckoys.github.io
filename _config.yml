title: Blog
email: ckdevel@me.com
description: my private blog
permalink: /:year:month:day/:title
url: https://ckoys.github.io
baseurl: /
github_username: ckoys

# Build settings

plugins:
  - jekyll-feed
  - jekyll-sitemap

# variables
name: Blog
google_verification: null

# File management
include: [".htaccess"]

# Sass
sass:
  style: compressed
  sass_dir: _sass

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: false

# Excluded
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - .DS_Store
